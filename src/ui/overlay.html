SPDX-FileCopyrightText: 2026 EON contributors

EON Browser's overlay: address suggestions and the command bar (Ctrl+K), drawn by a small
view of its own above the page so the page never moves for them. It is shown only while
open, talks only to https://ui.eon.invalid/cmd, and is handed only what a person reads.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EON Browser</title>
  <style>
    @font-face { font-family: "Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    :root { --ink: #15132b; --deck: #1f1c3d; --line: #3a3570; --mist: #ece9fb; --haze: #a7a2cc; --dim: #8a84b5; --pulse: #a08bff; --selected: rgba(160, 139, 255, 0.20); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--deck); color: var(--mist); font: 13px/1.4 "Geist", system-ui, sans-serif; user-select: none; }
    body { border: 1px solid var(--line); display: flex; flex-direction: column; }
    img { width: 16px; height: 16px; flex: none; display: block; }
    .search { display: none; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-bottom: 1px solid var(--line); flex: none; }
    .palette .search { display: flex; }
    #q { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; color: var(--mist); font: inherit; font-size: 15px; user-select: text; }
    #q::placeholder { color: var(--dim); }
    ul { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; min-height: 0; }
    li { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; color: var(--haze); }
    li:hover { background: rgba(160, 139, 255, 0.10); }
    li.sel { background: var(--selected); color: var(--mist); }
    .t { color: var(--mist); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .u { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    kbd { font: 11px "Geist", sans-serif; color: var(--dim); padding: 1px 5px; border: 1px solid var(--line); border-radius: 5px; flex: none; }
    .empty { color: var(--dim); padding: 10px; }
  </style>
</head>
<body>
  <div class="search"><img src="icons/command.svg" alt="">
    <input id="q" type="text" spellcheck="false" autocomplete="off" placeholder="Type a command, or search the web" aria-label="Command"></div>
  <ul id="list" role="listbox" aria-label="Suggestions"></ul>
  <script src="overlay.js"></script>
</body>
</html>
