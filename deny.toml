# cargo-deny: supply chain and licence gate (madde 37).

[advisories]
yanked = "deny"
ignore = [
    # SQLite before 3.54 can return uninitialized page-cache memory when it opens a
    # database together with a crafted `-wal` file of another page size (local; the victim
    # must open the attacker's files). The fix is libsqlite3-sys 0.39 (rusqlite 0.41), but
    # Servo 0.8 pins rusqlite 0.38 and two SQLite builds cannot link into one program.
    # Reachability: EON Browser opens only its own profile.sqlite and Servo's own stores,
    # in its own data folder, files it wrote itself; anyone who can plant a `-wal` there can
    # already rewrite the profile directly. Remove when Servo moves to rusqlite >= 0.41.
    "RUSTSEC-2026-0459",
    # rsa's private-key operations are not constant-time (Marvin). Reached through Servo's
    # Web Crypto (`subtlecrypto`), which pins rsa =0.10.0-rc.19. The browser holds no RSA
    # private key of the person (no client certificates); only a key a page imported itself
    # is used, and a timing leak reveals it at most to code the page runs anyway. Web Crypto
    # stays on because sign-in pages need it. Remove when Servo takes rsa 0.10.
    "RUSTSEC-2023-0071",
    # `cookie`'s PrivateJar can repeat AES-GCM nonces across fork(). Reached through Servo's
    # cookie parsing; a browser never seals private cookies, and Windows never forks.
    # Remove when Servo takes the fixed cookie release.
    "RUSTSEC-2026-0594",
]

[licenses]
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "0BSD",
    # Servo, the engine (madde 50a), and Brave's adblock engine in the core. MPL-2.0 is
    # copyleft per file and combines with GPL-3.0 as a Larger Work (MPL-2.0 §3.3); EON does
    # not change their files.
    "MPL-2.0",
    # webpki-roots' root certificates (data, permissive).
    "CDLA-Permissive-2.0",
    # LLVM's old licence, through libfuzzer-sys in an image decoder's tree (permissive).
    "NCSA",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# eon-browser-core, pinned by commit and version.
allow-git = ["https://github.com/EON-Extensible-Open-Network/eon-browser-core"]
