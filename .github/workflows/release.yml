name: release

# A tag `v*` builds EON Browser for Windows, Linux and macOS with the pinned toolchain,
# ships the blocking lists of the day inside it (madde 50e: no request on first start),
# runs --selftest on the binary about to be published, and publishes it with
# SHA256SUMS.txt as a prerelease.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x86_64, suffix: .exe }
          - { os: ubuntu-latest, platform: linux-x86_64, suffix: "" }
          - { os: macos-latest, platform: macos-aarch64, suffix: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libgl1-mesa-dri libgles2-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev libudev-dev
      - name: The blocking lists of the day, from their publishers
        shell: bash
        run: |
          mkdir -p seed
          get() { curl -sSfL --compressed --max-time 120 "$2" -o "seed/$1.txt"; }
          get easylist         https://easylist.to/easylist/easylist.txt
          get easyprivacy      https://easylist.to/easylist/easyprivacy.txt
          get ubo-filters      https://ublockorigin.github.io/uAssets/filters/filters.txt
          get ubo-privacy      https://ublockorigin.github.io/uAssets/filters/privacy.txt
          get ubo-badware      https://ublockorigin.github.io/uAssets/filters/badware.txt
          get ubo-unbreak      https://ublockorigin.github.io/uAssets/filters/unbreak.txt
          get easylist-cookie  https://secure.fanboy.co.nz/fanboy-cookiemonster.txt
          ls -la seed
          echo "EON_BROWSER_SEED_DIR=$PWD/seed" >> "$GITHUB_ENV"
      - run: rustup show
      # Two programs, two cargo invocations (route/Cargo.toml says why).
      - run: cargo build --release --locked -p eon-browser
      - run: cargo build --release --locked -p eon-browser-route
      # Windows: see ci.yml; the published Windows binary is self-tested on a real machine.
      - name: Self-test the binary about to be published
        if: runner.os != 'Windows'
        shell: bash
        run: target/release/eon-browser${{ matrix.suffix }} --selftest report.txt || { cat report.txt; exit 1; }
      # One archive per platform: the browser and its route process (Tor), side by side,
      # as the browser expects to find them.
      - name: Stage
        shell: bash
        run: |
          name="eon-browser-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          mkdir -p "pkg/$name" dist
          cp "target/release/eon-browser${{ matrix.suffix }}" "target/release/eon-browser-route${{ matrix.suffix }}" \
             LICENSE NOTICE "pkg/$name/"
          cd pkg
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "../dist/$name.zip" "$name" > /dev/null
          else
            zip -qr "../dist/$name.zip" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --prerelease --title "$GITHUB_REF_NAME" --notes-file .github/release-notes-alpha.md
